name: Validation Scientifique du Code

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  audit:
    name: Audit d’intégrité et Tests V8
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # --- NOUVEAU : Tests unitaires de la V8 ---
      - name: Exécution des tests unitaires (pytest)
        run: |
          python -m pytest tests/ -v

      # --- TON AUDIT EXISTANT ---
      # Note : assure-toi que le chemin vers python_integrity_audit.py 
      # est toujours correct après la réorganisation (ex: src/tools/...)
      - name: Exécution de l’audit d’intégrité
        run: |
          python 03_tools/python_integrity_audit.py . --json -o audit_report.json

      - name: Téléversement du rapport d’audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit_report.json
          if-no-files-found: warn
