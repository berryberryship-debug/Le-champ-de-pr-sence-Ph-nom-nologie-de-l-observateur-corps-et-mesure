name: Validation Scientifique du Code

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exécution de l'audit d'intégrité
        run: |
          python 03_tools/python_integrity_audit.py . --json -o audit_report.json
